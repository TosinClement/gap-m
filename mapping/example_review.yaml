# Tooling-assisted review of every example_of link that the necessity audit did not cover
# (the 210 links that were example_of from the start), plus a consistency check of the
# 86 audited links now held at example_of.
#
# This is a review prepared by the AI assistant with tooling support (source text pulled from
# the registry, rules enforced by the compiler). It is NOT independent expert validation, and it
# is NOT the author's review. Every remaining link stays review_status: proposed.
#
# Tests applied to each link, against the exact source text and the control's full definition:
#   T1 relevance       — the control's stated activity bears on the element as written, not on a
#                        neighbouring topic.
#   T2 interpretation  — the rationale describes the source element accurately (its subject,
#                        its phase: design-time vs. post-deployment, and its scope).
#   T3 support         — the rationale claims nothing the control's text does not actually say.
# decision: remove  — fails T1, or fails T2/T3 in a way a rewording cannot fix
#           revise  — passes T1; rationale reworded to fix T2/T3
#           keep    — passes all three (the remaining links are listed by apply step with the
#                     default note below unless a specific note is given)
review_status: proposed
prepared: "2026-10-05"
reviewer: "AI assistant (tooling-assisted); not independent expert validation; not the author's review"
default_keep_note: "Passes T1–T3: the control's stated activity bears on the element as written, and the rationale matches the source text and the control text."

remove:
- {link: "GM-GOV-01>RMF:GOVERN-2.3", test: T3, basis: "GOVERN 2.3 is about executive leadership taking responsibility for AI risk decisions. GM-GOV-01 has the plan approved by 'the AI governance body', not by executive leadership; the rationale's 'executive approval' is not in the control."}
- {link: "GM-GOV-01>A84:XC-IOC-B1", test: T1, basis: "The barrier concerns organizational incentives (competitive pressure versus oversight). A per-system plan does not address incentives; the rationale is speculative."}
- {link: "GM-GOV-01>CPG:1.A", test: T3, basis: "CPG 1.A concerns cybersecurity program roles. GM-GOV-01's RACI covers AI monitoring roles; security monitoring responsibilities are not in the control text."}
- {link: "GM-GOV-01>CPG:1.B", test: T1, basis: "CPG 1.B concerns the cybersecurity risk management strategy and policies. Sharing an annual review cadence is a coincidence of schedule, not substantive support."}
- {link: "GM-GOV-02>HTI:B1.ii", test: T3, basis: "The inventory's listed fields (version, developer, task and output type, sites, inputs, plan, attribute record) do not include funding source."}
- {link: "GM-GOV-02>HTI:B1.iii", test: T3, basis: "The inventory records output type, not a description of the value the intervention produces; the attribute is better supported by GM-HF-03."}
- {link: "GM-GOV-02>A84:XC-VT-G1", test: T1, basis: "The gap is lack of visibility into model properties (internals, behavior). A version-level inventory records which system is deployed, not its properties."}
- {link: "GM-GOV-03>RMF:MAP-4.1", test: T1, basis: "MAP 4.1 concerns mapping technology and legal risks of components, including intellectual-property infringement. GM-GOV-03 is about notice clauses, not legal risk mapping."}
- {link: "GM-GOV-03>HTI:B1.i", test: T1, basis: "Duplicates GM-GOV-02 and GM-HF-03; a notice clause does not maintain the developer-contact attribute in any way they do not."}
- {link: "GM-GOV-03>HTI:B5.i", test: T3, basis: "GM-GOV-03's notice obligations list model updates, known-risk changes, validation results, security incidents, and vulnerabilities. Changes to the developer's fairness approach are not among them."}
- {link: "GM-GOV-03>HTI:B5.ii", test: T3, basis: "As for (B)(5)(i): bias-management approaches are not among the control's notice obligations."}
- {link: "GM-GOV-03>HTI:B7.v", test: T3, basis: "Outcome evaluations are not 'validation results' as listed in the control; the rationale extends the clause beyond its text."}
- {link: "GM-GOV-03>HTI:B9.ii", test: T1, basis: "Correction frequency is not something a notice clause produces or checks; the link is too indirect to be substantive."}
- {link: "GM-GOV-03>A84:XC-IOC-B2", test: T2, basis: "The barrier concerns ecosystem-wide transparency. A bilateral contract between one deployer and one developer does not bear on it."}
- {link: "GM-GOV-04>RMF:GOVERN-6.2", test: T3, basis: "The control text does not mention third-party AI failures or contingency processes for them; the rationale adds content the control does not have."}
- {link: "GM-GOV-05>A84:LSI-B1", test: T1, basis: "The barrier concerns downstream effects of open-weight model releases, a developer and ecosystem issue. GAP-M addresses deployers of predictive interventions; the link is not substantive."}
- {link: "GM-GOV-05>CPG:5.B", test: T2, basis: "CPG 5.B concerns reporting confirmed cybersecurity incidents. Cyber incidents involving AI are already covered through GM-GOV-04; extending 5.B to non-cyber AI findings misreads its scope."}
- {link: "GM-GOV-06>CPG:3.J", test: T3, basis: "CPG 3.J is cybersecurity awareness training. GM-GOV-06 trains users on the intervention's intended use and limits; 'misuse and security awareness' is not in the control."}
- {link: "GM-GOV-07>A84:XC-TMT-G1", test: T1, basis: "An internal independent review does not bear on the field-level absence of trusted standards; the rationale ('makes up in part') is speculative."}
- {link: "GM-FUN-03>RMF:MAP-2.3", test: T2, basis: "MAP 2.3 is a design-time outcome (TEVV considerations identified and documented). Post-deployment drift detection does not identify or document those considerations."}
- {link: "GM-OPS-02>RMF:MEASURE-2.12", test: T1, basis: "MEASURE 2.12 concerns assessing the environmental impact and sustainability of AI model training and management. GM-OPS-02 tracks energy cost but does not assess environmental impact. (Reason corrected by the author on 2026-10-05; the earlier wording relied on an unsourced claim that inference energy is marginal.)"}
- {link: "GM-OPS-02>RMF:MAP-3.2", test: T2, basis: "MAP 3.2 concerns costs that result from AI errors and trustworthiness failures. GM-OPS-02 tracks operating and monitoring costs, which are a different cost."}
- {link: "GM-OPS-03>RMF:MANAGE-4.2", test: T1, basis: "MANAGE 4.2 concerns measurable continual-improvement activities and engagement. Change control prevents unauthorized change; it does not produce improvement."}
- {link: "GM-HF-01>A84:HF-G1", test: T2, basis: "The gap is insufficient research on human-AI feedback loops. An operational feedback form is not research, and the rationale overstates what it studies."}
- {link: "GM-HF-01>A84:XC-IOC-B3", test: T1, basis: "The barrier is the administrative burden of monitoring on organizations. A low-effort feedback button does not bear on it."}
- {link: "GM-HF-02>RMF:GOVERN-3.2", test: T2, basis: "GOVERN 3.2 concerns policies that define roles for human-AI configurations. Telemetry by role does not define or differentiate roles."}
- {link: "GM-SEC-01>CPG:4.A", test: T3, basis: "CPG 4.A is malicious code detection. GM-SEC-01 detects anomalous inputs and outputs; scanning model files is not in the control."}
- {link: "GM-SEC-02>CPG:2.D", test: T3, basis: "CPG 2.D is a public vulnerability disclosure route for outside reporters. GM-SEC-02 requires developer disclosure, which is CPG 1.D; the control does not operate a public route."}
- {link: "GM-SEC-02>CPG:3.S", test: T3, basis: "The control does not mention internet-facing assets; whether model endpoints face the internet is deployment-specific."}
- {link: "GM-CMP-01>A84:XC-TMT-G1", test: T1, basis: "The rationale describes the GAP-M crosswalk itself, not the control. A requirements register does not address the lack of trusted monitoring standards."}
- {link: "GM-CMP-03>RMF:MANAGE-2.4", test: T2, basis: "MANAGE 2.4 concerns systems whose performance or outcomes are inconsistent with intended use. Out-of-scope use is a use pattern, not system performance or outcome."}
# consistency check of the 86 audited example_of links (not part of the 210):
- {link: "GM-GOV-07>CPG:2.C", test: T1, scope: audited, basis: "The necessity audit already found that CPG 2.C is third-party validation of cybersecurity defenses and that a review of AI monitoring design is not that activity. The remaining example_of rationale (scheduling alongside) is not substantive support."}

- link: GM-GOV-03>RMF:MANAGE-3.2
  test: T2
  scope: author_review
  basis: Removed by the author in the guided review (2026-10-05). MANAGE 3.2 concerns pre-trained models that an organization uses for development; a deploying organization using a vendor's finished intervention is not using a pre-trained model for development, so the link misread the source.
- link: GM-OPS-01>A84:FUN-B3
  test: T1
  scope: author_review
  basis: Removed by the author in the guided review (2026-10-05). The barrier is the overhead of longitudinal tracking; central logging is an input to tracking but does not reduce its overhead. FUN-B3 remains covered by GM-FUN-05.
revise:
- {link: "GM-GOV-01>RMF:GOVERN-1.2", test: T2,
   basis: "GOVERN 1.2 concerns organizational policies; a per-system plan is a procedure, not policy.",
   rationale: "Listing validity, fairness, security, and privacy measures in each monitoring plan is one practice through which trustworthy characteristics enter monitoring procedures."}
- {link: "GM-GOV-01>RMF:MEASURE-4.1", test: T3,
   basis: "The old rationale said the plan records who was consulted; the control does not require consultation.",
   rationale: "The plan documents the measurement approaches chosen for the specific deployment context."}
- {link: "GM-GOV-02>RMF:MAP-2.1", test: T2,
   basis: "MAP 2.1 is about defining tasks and methods (design time); the inventory records them.",
   rationale: "The inventory records the defined task and method of each deployed system, keeping that definition visible after deployment."}
- {link: "GM-GOV-03>RMF:GOVERN-6.2", test: T3,
   basis: "'Remedy clauses' are not in the control.",
   rationale: "Contractual notice of developer incidents is an input to contingency processes for third-party AI failures."}
- {link: "GM-GOV-03>RMF:MANAGE-3.2", test: T3,
   basis: "'Brings them into routine monitoring' overstated what a notice does.",
   rationale: "Notice of changes to the underlying model gives the deployer's routine monitoring a trigger to re-check it."}
- {link: "GM-GOV-03>HTI:B9.i", test: T3,
   basis: "The control is a notice clause; the update process itself is not a contract term in the control.",
   rationale: "Developer notices of model updates show how often the intervention is actually updated."}
- {link: "GM-FUN-02>RMF:MEASURE-4.2", test: T3,
   basis: "Review by domain experts is not in the control.",
   rationale: "Local validity results are measurement results on whether the system performs consistently as intended in its deployment context."}
- {link: "GM-OPS-01>RMF:MANAGE-4.1", test: T2,
   basis: "MANAGE 4.1 lists specific mechanisms; logging is not one of them.",
   rationale: "Logs provide the record that the plan's incident-response and change-management mechanisms rely on."}
- {link: "GM-OPS-04>RMF:MANAGE-2.4", test: T3,
   basis: "'Deactivation is only safe if a fallback exists' asserted necessity in an example_of rationale.",
   rationale: "A fallback workflow lets the system be disengaged without interrupting the work it supported."}

keep_notes:
  "GM-GOV-03>CPG:1.E": "Applies only where the developer hosts or operates the model (conditional on deployment)."
  "GM-FAIR-02>A84:LSI": "Depends on judgment call J4 (fairness placed under Functionality with Large-Scale Impacts secondary)."
  "GM-HF-02>A84:HF-G1": "Kept, unlike GM-HF-01's link to the same gap: reliance and override trends observed over time are direct evidence about a human-AI feedback loop, not a stand-in for research."
  "GM-CMP-02>HTI:B6.i": "The not-available indication is an obligation of the Health IT Module ((v)(A)(2)); the deployer's audit checks the module's behaviour, it does not meet the obligation."
  "GM-GOV-04>A84:XC-TMT-G1": "Grounded in AI 800-4 section 3.1.1 text on missing guidance for 'what the plan is for when an anomaly is detected'."

