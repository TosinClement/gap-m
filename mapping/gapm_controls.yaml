  - [RMF:MEASURE-3.1, example_of, "Aggregated logs identify emergent risks."]
  - [RMF:MAP-5.1, example_of, "Logged incidents inform the likelihood and magnitude of each impact."]
  - [RMF:GOVERN-4.3, example_of, "A shared log supports identifying incidents across teams."]
  - [HTI:B3.ii, example_of, "Confirmed incident patterns become known risks in the source-attribute record."]
- id: GM-LSI-02
  family: LSI
  title: Outcome and benefit measurement
  objective: The intended benefit (outcome, process, or experience measures) and unintended downstream effects are tracked at population level, with periodic review of whether benefits are realized and references to evaluations kept.
  activity: Define benefit measures before go-live; review realized benefit and side effects at least annually.
  evidence: Benefit measure definitions; annual benefit review; evaluation references.
  cadence: Annual review.
  owner_role: Clinical or business owner
  links:
  - [A84:LSI-G1, example_of, "Defining benefit measures is one response to the gap in metrics for beneficial impacts."]
  - [A84:LSI, example_of, "Population-level benefit measures are one form of large-scale impact monitoring."]
