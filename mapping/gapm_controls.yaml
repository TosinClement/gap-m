# GAP-M v0.1.0 control set and crosswalk links — the single human-edited source of truth.
# 04_build.py compiles this file into JSON, CSV, OSCAL and XLSX outputs and validates it.
#
# Link format: [target_element_id, property, rationale]
#   Relationship type is always "supports" (NIST IR 8477 supportive relationship mapping):
#   the GAP-M control (concept A) supports the source element (concept B).
#   property (IR 8477): integral_to — B cannot be achieved without A
#                       example_of  — A is one way of achieving B in whole or in part
#                       precedes    — A must be achieved before B can be applied
#   For an HTI-1 source attribute, "achieving B" means keeping that attribute's value accurate
#   and current after deployment.
#   For an AI 800-4 challenge, "achieving B" means the control addresses that gap or barrier
#   in the deploying organization's own monitoring program.
#
# review_status applies to every link and control until the author rules on it (J2, J3).
review_status: proposed

families:
  GOV: {name: Monitoring governance, a84_primary: XC}
  FUN: {name: Functionality monitoring, a84_primary: FUN}
  FAIR: {name: Fairness monitoring, a84_primary: FUN, note: "AI 800-4 has no fairness category; placed under Functionality with Large-Scale Impacts as secondary (J4)"}
  OPS: {name: Operational monitoring, a84_primary: OPS}
  HF: {name: Human factors monitoring, a84_primary: HF}
  SEC: {name: Security monitoring, a84_primary: SEC}
  CMP: {name: Compliance monitoring, a84_primary: CMP}
  LSI: {name: Large-scale impacts monitoring, a84_primary: LSI}

controls:

# ------------------------------------------------------------------ GOV
- id: GM-GOV-01
  family: GOV
  title: Monitoring plan and accountable owner
  objective: Each deployed predictive AI system has an approved post-deployment monitoring plan that names an accountable owner and sets the measures, cadence, thresholds, escalation path, and remediation authority, with monitoring intensity tiered by risk.
  activity: Approve the plan before go-live; review it at least annually and after every material model update, threshold breach, or incident.
  evidence: Approved monitoring plan with version history; responsibility (RACI) matrix; review minutes.
  cadence: Before go-live; annually; on material change.
  owner_role: System owner, approved by the AI governance body or equivalent
  links:
  - [RMF:GOVERN-1.5, example_of, "The plan's review cycle and named roles feed the organization's periodic review of its risk management process."]
  - [RMF:MANAGE-4.1, integral_to, "MANAGE 4.1 is the outcome that post-deployment monitoring plans are implemented; a plan covering the system is a component of that outcome."]
  - [RMF:GOVERN-2.1, example_of, "The plan's RACI is one place monitoring roles and lines of communication are documented."]
  - [RMF:GOVERN-1.3, example_of, "Tiering monitoring intensity by risk sets the level of risk management activity from risk tolerance."]
  - [RMF:GOVERN-1.4, example_of, "A documented plan makes the monitoring process and its outcomes transparent and controlled."]
  - [RMF:GOVERN-1.2, example_of, "Listing validity, fairness, security, and privacy measures in each monitoring plan is one practice through which trustworthy characteristics enter monitoring procedures."]
  - [RMF:MEASURE-4.1, example_of, "The plan documents the measurement approaches chosen for the specific deployment context."]
  - [HTI:B8.i, example_of, "Where the deploying organization runs validity monitoring, its plan is the process the attribute can describe."]
  - [HTI:B8.iii, example_of, "Where the deploying organization runs fairness monitoring, its plan is the process the attribute can describe."]
  - [A84:XC-TMT-B1, example_of, "A per-system plan tailors measures to the use case instead of assuming a generic method."]
- id: GM-GOV-02
  family: GOV
  title: AI system and model inventory
  objective: An inventory lists every deployed predictive AI system with its version, developer, task and output type, deployment sites, data inputs, monitoring plan, and a link to or copy of the current source-attribute record.
  activity: Update the inventory at deployment, update, and retirement; reconcile it against EHR configuration at least quarterly.
  evidence: Inventory export with change log; quarterly reconciliation record.
  cadence: On change; quarterly reconciliation.
  owner_role: AI governance office
  links:
  - [RMF:GOVERN-1.6, integral_to, "GOVERN 1.6 asks for mechanisms to inventory AI systems; recording deployed AI systems in an inventory is what such a mechanism does."]
  - [RMF:MAP-2.1, example_of, "The inventory records the defined task and method of each deployed system, keeping that definition visible after deployment."]
  - [CPG:2.A, example_of, "Recording each deployed AI intervention in the asset inventory is one way to bring AI components into the asset-inventory goal."]
  - [HTI:B1.i, example_of, "The inventory record keeps the developer's name and contact information current."]
  - [HTI:B1.iv, example_of, "The inventory record states the output type (prediction, classification, recommendation, and so on)."]
  - [A84:XC-PC-B1, example_of, "Version tracking keeps the record current as models and vendors change across the AI stack."]
- id: GM-GOV-03
  family: GOV
  title: Developer monitoring obligations in contracts
  objective: Contracts with the intervention developer require notice, within contract-defined time frames, of model updates, changes to known risks, new validation results, security incidents, and vulnerabilities, and delivery of updated source attributes.
  activity: Include notice clauses and time frames in contracts; track developer notices and confirm source attributes are refreshed after each notice.
  evidence: Contract clauses; developer notice log; source-attribute refresh records.
  cadence: At contracting and renewal; on each developer notice.
  owner_role: Procurement with the system owner
  links:
  - [CPG:1.D, integral_to, "Contract terms requiring the developer to notify the organization of security incidents and vulnerabilities are this goal's recommended action."]
  - [CPG:1.E, example_of, "When the developer hosts or operates the model, these clauses manage risk from a managed service provider."]
  - [RMF:GOVERN-6.1, example_of, "Contract terms that oblige the developer to disclose changes put third-party AI risk policy into practice."]
  - [RMF:GOVERN-6.2, example_of, "Contractual notice of developer incidents is an input to contingency processes for third-party AI failures."]
  - [RMF:MANAGE-3.1, example_of, "Contractual notice of developer changes is one input to regular monitoring of third-party AI risk."]
  - [RMF:MAP-4.2, example_of, "Contract obligations are one internal risk control for third-party AI components."]
  - [HTI:B6.i, example_of, "New external validation settings are delivered under the contract's clause requiring notice of new validation results."]
  - [HTI:B6.ii, example_of, "The party conducting new external testing is reported under the contract's clause requiring notice of new validation results."]
  - [HTI:B6.iii, example_of, "Demographic representativeness of new external data is reported under the contract's clause requiring notice of new validation results."]
  - [HTI:B6.iv, example_of, "Descriptions of new external validation processes are delivered under the contract's clause requiring notice of new validation results."]
  - [HTI:B7.iii, example_of, "New external validity results are delivered under the contract's clause requiring notice of new validation results."]
  - [HTI:B7.iv, example_of, "New external fairness results are delivered under the contract's clause requiring notice of new validation results."]
  - [HTI:B9.i, example_of, "Developer notices of model updates show how often the intervention is actually updated."]
  - [A84:XC-VT-G2, example_of, "Contractual notice builds a working information-sharing channel between developer and deployer."]
- id: GM-GOV-04
  family: GOV
  title: AI incident response integration
  objective: Incident response plans cover AI-specific incidents (performance collapse, harmful or biased outputs, misuse, compromise of model or data), with severity criteria, containment steps, internal and external communication, and reporting, and are exercised at least annually.
  activity: Add AI scenarios to the incident response plan and run at least one AI scenario in the annual exercise.
  evidence: Incident response plan with AI annex; exercise after-action report.
  cadence: Annual exercise; plan update after each AI incident.
  owner_role: Incident response lead with the system owner
  links:
  - [CPG:1.C, example_of, "Adding AI compromise scenarios to the IR plan is one way to cover organizationally specific threats."]
  - [CPG:5.A, example_of, "The AI annex adds AI-specific stakeholders to the incident communications plan."]
  - [CPG:5.B, example_of, "The AI annex makes explicit that confirmed cybersecurity incidents involving the AI system (for example, compromise of the model or its data) are reported under the general policy."]
  - [CPG:6.A, example_of, "Updating the AI annex after each AI incident is one way to refine the incident response plan from lessons learned."]
  - [RMF:MANAGE-4.3, example_of, "An AI annex to the IR plan is one documented process for responding to and recovering from AI incidents."]
  - [RMF:MANAGE-2.3, example_of, "Responding to a newly found AI risk follows the plan's AI procedures."]
  - [RMF:MANAGE-4.1, example_of, "Incident response and recovery are named parts of a post-deployment monitoring plan."]
  - [RMF:GOVERN-4.3, example_of, "A planned AI incident pathway lets teams identify and handle incidents."]
  - [A84:XC-TMT-G1, example_of, "AI 800-4 (section 3.1.1) reports missing guidance on what to do when an anomaly is detected; the annex supplies that pathway."]
- id: GM-GOV-05
  family: GOV
  title: External sharing of monitoring findings
  objective: Monitoring findings (incidents, drift, bias, security issues, outcome evaluations) are shared with the developer and, under a defined policy and subject to legal and privacy review, with peer deployers and sector bodies such as information sharing and analysis centers or patient safety organizations.
  activity: Apply a sharing policy that sets what is shared, with whom, how fast, and with what de-identification.
  evidence: Sharing policy; log of findings shared and recipients.
  cadence: On each qualifying finding; policy reviewed annually.
  owner_role: AI governance office
  links:
  - [RMF:GOVERN-4.2, example_of, "A findings-sharing policy is one way to communicate risks and impacts more broadly."]
  - [RMF:GOVERN-4.3, example_of, "An external sharing policy is one practice that enables information sharing about AI incidents and testing."]
  - [RMF:MANAGE-4.3, example_of, "Sharing findings is one way incidents and errors reach relevant AI actors."]
  - [A84:XC-VT-G2, example_of, "Deployers sharing findings is one contribution to a more mature information-sharing ecosystem."]
  - [A84:XC-IOC-B2, example_of, "A standing policy gives ecosystem-wide transparency a set place in operations."]
  - [A84:LSI-G2, example_of, "Shared incident reports let large-scale patterns appear that a single deployer's log would miss."]
  - [HTI:B3.ii, example_of, "Shared findings return newly found risks and limitations to the developer for the source-attribute record."]
  - [HTI:B7.v, example_of, "Sharing local outcome evaluations adds to the evidence base the attribute references."]
- id: GM-GOV-06
  family: GOV
  title: Monitoring resources and competence
  objective: Monitoring has budgeted resources (outcome labels, compute, reviewer and clinician time, tooling), trained staff, and users trained on the intervention's intended use and limits.
  activity: Set the monitoring budget in the plan; train monitoring staff and users before access and when the intervention changes.
  evidence: Budget line; training records; staffing assignments.
  cadence: Annual budget; training at onboarding and on change.
  owner_role: System owner
  links:
  - [RMF:GOVERN-2.2, example_of, "System-specific training for monitoring staff and users is one form of AI risk management training that enables them to perform their duties."]
  - [RMF:MAP-3.4, example_of, "System-specific training is one process for establishing operator and practitioner proficiency."]
  - [RMF:MANAGE-2.1, example_of, "A monitoring budget is one way resources required to manage AI risk are taken into account."]
  - [A84:XC-RR-B1, example_of, "A monitoring budget makes financial, compute, and human resource costs explicit."]
  - [A84:XC-RR-B2, example_of, "Training and staffing plans address the shortage of qualified monitoring staff."]
  - [A84:XC-PC-B2, example_of, "Planned staffing keeps human review capacity in step with rollouts."]
  - [A84:XC-IOC-B3, example_of, "Budgeting for tooling and automation lowers the administrative burden of monitoring."]
- id: GM-GOV-07
  family: GOV
  title: Independent assessment of monitoring
  objective: An assessor independent of the team that built or operates the system periodically reviews monitoring design, metrics, thresholds, and results, and findings are tracked to closure.
  activity: Schedule independent review by risk tier (for example, annually for high-risk systems); track findings in a risk register.
  evidence: Independent review report; findings tracker.
  cadence: By risk tier; at least every two years.
  owner_role: Internal audit or external assessor
  links:
  - [RMF:MEASURE-1.3, example_of, "An assessor independent of both the build and operate teams is one way to involve experts who did not serve as front-line developers in regular assessments."]
  - [RMF:MEASURE-2.13, example_of, "The review evaluates how effective the monitoring metrics and processes are."]
  - [RMF:MEASURE-1.2, example_of, "The review regularly reassesses whether metrics are appropriate and controls effective."]
  - [RMF:MEASURE-4.2, example_of, "The assessor's review is one source of expert input on whether the system performs as intended."]
  - [A84:XC-TMT-B2, example_of, "The review examines measurement uncertainty and variability in monitoring results."]
# ------------------------------------------------------------------ FUN
- id: GM-FUN-01
  family: FUN
  title: Performance baseline and deviation thresholds
  objective: Before go-live, the organization records the baseline the system will be monitored against (validity metrics with uncertainty from the developer's internal and external validation results and, where feasible, from a local silent trial) and sets deviation thresholds that trigger review, correction, or deactivation.
  activity: Run a local silent (shadow) trial where feasible; record baseline metrics and confidence intervals; set thresholds in the monitoring plan.
  evidence: Baseline report; threshold table in the monitoring plan.
  cadence: Before go-live; after every model update.
  owner_role: Clinical or business owner with the data science lead
  links:
  - [A84:FUN-G2, example_of, "Recording a local baseline with deviation thresholds is one response to the baseline-and-threshold gap."]
  - [A84:FUN, example_of, "A baseline is one reference point for functionality monitoring."]
  - [RMF:MEASURE-1.1, example_of, "Choosing baseline metrics, and recording risks left unmeasured, is part of selecting measurement approaches."]
  - [RMF:MEASURE-2.3, example_of, "A local silent trial measures performance under conditions like the deployment setting."]
  - [RMF:MEASURE-2.5, example_of, "The baseline shows the system is valid and reliable locally and records limits on generalizability."]
  - [RMF:MEASURE-2.1, example_of, "The baseline report documents the test sets, metrics, and tools used."]
  - [RMF:MAP-1.5, example_of, "Numeric deviation thresholds state the organization's risk tolerance for this system."]
  - [RMF:MANAGE-1.1, example_of, "A local baseline informs the determination of whether deployment should proceed."]
  - [HTI:B7.i, example_of, "The developer's same-source validity result is checked and recorded as part of the baseline."]
  - [HTI:B7.iii, example_of, "The developer's external validity result is checked and recorded as part of the baseline."]
  - [HTI:B4.iv, example_of, "The silent trial tests whether training data are relevant to the local deployed setting."]
  - [HTI:B8.ii, example_of, "A baseline gives the local validity value a reference for interpretation."]
- id: GM-FUN-02
  family: FUN
  title: Local validity monitoring
  objective: The intervention's validity in local data (for example discrimination, calibration, and positive predictive value at the operating threshold) is measured with confidence intervals at the planned cadence and compared with the baseline and thresholds.
  activity: Compute validity metrics on each monitoring window; flag threshold breaches to the owner.
  evidence: Monitoring dashboard extracts; threshold breach log.
  cadence: As set in the plan (for example monthly or quarterly), plus event-driven.
  owner_role: Data science lead
  links:
  - [HTI:B8.ii, integral_to, "A populated local-validity value is a measurement of validity in local data, which is this control's core."]
  - [HTI:B8.i, example_of, "Where the deploying organization runs it, local validity monitoring is the process the attribute can describe."]
  - [A84:FUN-B1, example_of, "Measuring local validity over time is one way to detect performance degradation."]
  - [A84:FUN, example_of, "Local validity monitoring is one form of functionality monitoring."]
  - [RMF:MEASURE-2.4, example_of, "Measuring validity in production is one way to monitor the system's functionality."]
  - [RMF:MEASURE-3.1, example_of, "Local validity results are one factor for tracking emergent risk in the deployed context."]
  - [RMF:MEASURE-2.5, example_of, "Local validity results document how well the system generalizes beyond the conditions under which it was developed."]
  - [RMF:MEASURE-4.2, example_of, "Local validity results are measurement results on whether the system performs consistently as intended in its deployment context."]
  - [RMF:MANAGE-2.2, example_of, "Catching degradation early sustains the value of the deployed system."]
- id: GM-FUN-03
  family: FUN
  title: Input data and population drift detection
  objective: The distribution of input features, missingness, upstream data changes (for example code-set or EHR build changes), and the patient-population mix are monitored against the training-data description and the baseline, with alerts on meaningful shift.
  activity: Run drift statistics on each monitoring window; review alerts with data owners; record upstream changes.
  evidence: Drift report; upstream change log; alert review notes.
  cadence: Weekly or monthly automated; on upstream change.
  owner_role: Data engineering with the data science lead
  links:
  - [A84:FUN-B1, example_of, "Input drift detection is one way to detect drift before outcome labels arrive."]
  - [HTI:B4.iv, example_of, "Drift monitoring gives local evidence on whether the training-data relevance statement holds."]
  - [HTI:B4.iii, example_of, "The training data's demographic profile is the reference for population-mix monitoring."]
  - [HTI:B4.i, example_of, "Inclusion and exclusion criteria define which local patients fall outside the training population."]
  - [RMF:MEASURE-2.4, example_of, "Monitoring the behavior of system components in production includes its input data."]
  - [RMF:MEASURE-2.5, example_of, "Drift alerts show when the system operates beyond the conditions it was developed under."]
  - [RMF:MEASURE-3.1, example_of, "Drift alerts identify emergent risks before outcome labels arrive."]
  - [A84:XC-PC-B1, example_of, "Upstream change logging catches shifts elsewhere in the stack that silently alter inputs."]
- id: GM-FUN-04
  family: FUN
  title: Outcome label acquisition
  objective: The organization defines how and when reference-standard outcomes are obtained for monitored cases (source, label definition, expected delay, adjudication sample) and uses label-efficient or proxy measures, with stated uncertainty, while labels are delayed.
  activity: Write a label specification; adjudicate a sample of labels; report proxy measures with their limits until labels mature.
  evidence: Label specification; adjudication agreement statistics; proxy-measure notes.
  cadence: Defined before go-live; adjudication sample each monitoring cycle.
  owner_role: Clinical owner with the data science lead
  links:
  - [A84:FUN-B2, example_of, "A label specification with adjudication is one response to missing ground truth."]
  - [RMF:MEASURE-3.2, example_of, "Proxy measures with stated uncertainty are a risk-tracking approach for when metrics are not yet available."]
  - [RMF:MAP-2.3, example_of, "Defining and adjudicating labels is construct validation for the monitored outcome."]
  - [RMF:MEASURE-1.1, example_of, "The label specification records which risks are not yet measurable and why."]
  - [HTI:B8.ii, example_of, "Local outcome labels come first for outcome-based validity measures such as discrimination and calibration; whether every local validity value is label-based is unresolved."]
  - [HTI:B8.iv, example_of, "For label-dependent fairness measures such as subgroup calibration or error-rate parity, local outcome labels come first; label-free measures such as output-rate parity can be computed without them."]
  - [A84:XC-TMT-B2, example_of, "Adjudication statistics quantify uncertainty in the monitoring results themselves."]
- id: GM-FUN-05
  family: FUN
  title: Longitudinal record and version comparison
  objective: Monitoring results are kept as a time series across model versions and configuration changes, and every update is compared against the current version on the same local data before it goes live where the organization controls update timing, and otherwise promptly after.
  activity: Keep results in a versioned store; run a champion-challenger or before-and-after comparison for each update.
  evidence: Longitudinal results store; version comparison reports.
  cadence: Continuous retention; each update.
  owner_role: Data science lead
  links:
  - [A84:FUN-G1, example_of, "Same-data comparison of model versions is one form of systematic model comparison."]
  - [A84:FUN-B3, example_of, "A retained time series is one way to lower the overhead of longitudinal tracking."]
  - [RMF:MANAGE-4.2, example_of, "Version comparison makes measurable improvement part of every update."]
  - [RMF:MEASURE-4.3, integral_to, "Identifying a measurable improvement or decline requires performance from more than one point in time to be available for comparison."]
  - [RMF:MEASURE-3.1, example_of, "The time series shows risks that emerge slowly over many windows."]
  - [HTI:B9.i, example_of, "The comparison record shows the update process and frequency described in the attribute in practice."]
  - [HTI:B9.ii, example_of, "The record shows how often performance was corrected after risks were found."]
- id: GM-FUN-06
  family: FUN
  title: Correction and deactivation triggers
  objective: Threshold breaches lead to pre-defined actions (review, recalibration or retraining request, restricted use, or deactivation) with a named authority, time limits, and user notification; reactivation requires a new baseline.
  activity: Write a trigger-action table; record each breach, the action taken, and its timing.
  evidence: Trigger-action table; breach and action log; deactivation and reactivation records.
  cadence: On each breach.
  owner_role: System owner with clinical leadership
  links:
  - [RMF:MANAGE-2.4, integral_to, "MANAGE 2.4 names mechanisms, with assigned responsibility, to supersede, disengage, or deactivate a system; that mechanism is this control's core."]
  - [RMF:MANAGE-1.3, example_of, "A trigger-action table is a documented response plan for performance risks the organization rates high priority."]
  - [RMF:MANAGE-1.2, example_of, "Tiered actions prioritize treatment by the size of the breach."]
  - [RMF:GOVERN-1.7, example_of, "Deactivation procedures cover safe phase-out of an AI system."]
  - [RMF:MEASURE-2.6, example_of, "Defined response times make the system fail safely when it underperforms."]
  - [HTI:B9.ii, example_of, "Deployer triggers show how often performance is corrected locally, which the attribute can describe."]
  - [A84:FUN-G2, example_of, "AI 800-4 reports practitioners' call for deviation thresholds 'to trigger corrective actions or reviews' (p. 18); this control ties threshold breaches to set actions."]
# ------------------------------------------------------------------ FAIR
- id: GM-FAIR-01
  family: FAIR
  title: Subgroup performance baseline
  objective: Before go-live, validity by subgroup is recorded for the characteristics listed in 45 CFR 170.315(b)(11)(iv)(A)(5)-(13) (a list the regulation gives for evidence-based interventions, used here as a reference set) that are used as inputs or available locally, from developer and local silent-trial results, and subgroup disparity thresholds are set.
  activity: Compute subgroup metrics in the silent trial; compare them with developer-reported fairness; set disparity thresholds in the plan.
  evidence: Subgroup baseline report; disparity threshold table.
  cadence: Before go-live; after every model update.
  owner_role: Data science lead with the health equity lead
  links:
  - [RMF:MEASURE-2.11, example_of, "A local subgroup baseline is one documented fairness evaluation."]
  - [RMF:MAP-2.3, example_of, "Subgroup analysis tests representativeness of the data for the local population."]
  - [RMF:MEASURE-1.1, example_of, "Choosing subgroup metrics, and recording subgroups too small to measure, is part of selecting approaches."]
  - [A84:FUN-G2, example_of, "Disparity thresholds are performance thresholds applied to subgroups."]
  - [HTI:B7.ii, example_of, "The developer's same-source fairness result is checked and recorded as part of the baseline."]
  - [HTI:B7.iv, example_of, "The developer's external fairness result is checked and recorded as part of the baseline."]
  - [HTI:B4.ii, example_of, "The demographic variables used as input features indicate which subgroups to monitor."]
  - [HTI:B4.iii, example_of, "Training-data representativeness shows which local subgroups the model saw little of."]
  - [HTI:B6.iii, example_of, "External-data representativeness shows which subgroups have external evidence."]
- id: GM-FAIR-02
  family: FAIR
  title: Local fairness monitoring
  objective: Subgroup validity and disparity in local data are measured at the planned cadence, and disparities beyond thresholds are investigated.
  activity: Compute subgroup metrics on each monitoring window; investigate and document breaches.
  evidence: Subgroup monitoring report; investigation notes.
  cadence: As set in the plan, aligned with GM-FUN-02.
  owner_role: Data science lead with the health equity lead
  links:
  - [HTI:B8.iv, example_of, "Measuring subgroup performance and output disparities in local data is one way to produce the local fairness value."]
  - [HTI:B8.iii, example_of, "Where the deploying organization runs it, local fairness monitoring is the process the attribute can describe."]
  - [RMF:MEASURE-2.11, example_of, "Measuring subgroup performance in production is one ongoing fairness evaluation."]
  - [RMF:MEASURE-2.4, example_of, "Subgroup performance is part of monitoring system behavior in production."]
  - [RMF:MEASURE-3.1, example_of, "Disparities that grow after deployment are emergent risks this control tracks."]
  - [A84:FUN-B1, example_of, "Degradation can be confined to subgroups and missed by overall metrics."]
  - [A84:LSI, example_of, "Subgroup disparities are one downstream impact on groups and communities."]
# ------------------------------------------------------------------ OPS
- id: GM-OPS-01
  family: OPS
  title: Central, tamper-protected monitoring logs
  objective: Inference events, inputs or their hashes (minimized for protected health information), outputs, model version, user actions, and monitoring results are logged to a central, access-controlled, tamper-evident store with risk-based retention, and an alert fires when logging stops.
  activity: Route AI system logs to the central log platform; test the logging-failure alert.
  evidence: Log pipeline configuration; retention setting; logging-failure alert test.
  cadence: Continuous; alert test quarterly.
  owner_role: Platform engineering with security operations
  links:
  - [CPG:3.Q, integral_to, "CPG 3.Q's action covers application and service logs on all assets where feasible; collecting the AI components' administrative and security logs centrally, with an alert if logging stops, is that action applied to the AI system."]
  - [A84:OPS-B1, example_of, "A central log store is one answer to fragmented logging across distributed infrastructure."]
  - [A84:OPS, example_of, "Complete logs are one basis for infrastructure-level monitoring."]
  - [RMF:MEASURE-2.8, example_of, "Complete logs support examining transparency and accountability risks."]
  - [RMF:MANAGE-4.1, example_of, "Logs provide the record that the plan's incident-response and change-management mechanisms rely on."]
  - [RMF:MEASURE-2.4, example_of, "Central logs are one data source for production monitoring."]
  - [A84:HF-G5, example_of, "Captured logs are one source of telemetry to put to use."]
- id: GM-OPS-02
  family: OPS
  title: Service level and cost telemetry
  objective: Availability, latency, error and timeout rates, fallback use, and direct and indirect costs (compute, licensing, labeling, reviewer and clinician time, energy) are tracked per intervention.
  activity: Report service levels against targets; report cost per intervention each budget cycle.
  evidence: Service-level report; cost report.
  cadence: Continuous service levels; quarterly cost.
  owner_role: Platform engineering with finance
  links:
  - [A84:OPS-G1, example_of, "Tracking reviewer time, labeling, and energy is one way to track indirect costs beyond compute."]
  - [A84:OPS, example_of, "Service-level monitoring is one form of operational monitoring."]
