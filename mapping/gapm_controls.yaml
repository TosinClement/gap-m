# ------------------------------------------------------------------ SEC
- id: GM-SEC-01
  family: SEC
  title: Adversarial input, misuse, and anomalous behavior detection
  objective: Anomalous or crafted inputs, out-of-distribution queries, unexpected output distributions, and behavior that differs between test and production conditions are detected and routed to security operations.
  activity: Run input and output anomaly rules; compare production behavior with evaluation behavior; route alerts to the security operations queue.
  evidence: Detection rules; alert log; triage records.
  cadence: Continuous.
  owner_role: Security operations with the data science lead
  links:
  - [A84:SEC-B1, example_of, "Comparing production with evaluation behavior is one check for deceptive behavior."]
  - [A84:SEC, example_of, "Detecting attack and misuse attempts is one form of security monitoring."]
  - [CPG:4.B, example_of, "AI-specific anomaly rules extend the organization's adverse-event criteria to the AI system."]
  - [RMF:MEASURE-2.7, example_of, "Attack and misuse detection in production adds to the security and resilience evaluation."]
  - [RMF:MEASURE-2.6, example_of, "Detecting inputs beyond the system's knowledge limits supports safe failure."]
  - [HTI:B3.ii, example_of, "Confirmed misuse patterns become known risks in the source-attribute record."]
- id: GM-SEC-02
  family: SEC
  title: Vulnerability management for AI components
  objective: Vulnerabilities in model-serving software and libraries (including those on CISA's Known Exploited Vulnerabilities catalog), weaknesses in model artifacts, and AI-specific weaknesses are tracked and remediated by risk, and the developer is required to disclose them.
  activity: Include AI components in vulnerability scanning and patching; track AI weaknesses in the vulnerability register.
  evidence: Scan results; remediation records; vulnerability register entries.
  cadence: Continuous scanning; remediation by severity.
  owner_role: Security operations
  links:
  - [CPG:2.B, integral_to, "AI software components the organization operates are organizational assets, so they fall within the vulnerability management program this goal requires."]
  - [CPG:1.D, example_of, "Developer vulnerability disclosure is part of supply chain reporting."]
  - [RMF:MEASURE-2.7, example_of, "Vulnerability results are evidence for the security evaluation."]
  - [RMF:MANAGE-3.1, example_of, "Tracking vulnerabilities in third-party AI software monitors third-party risk."]
  - [RMF:GOVERN-6.1, example_of, "Vulnerability disclosure terms put third-party AI risk policy into practice."]
  - [A84:SEC, example_of, "Vulnerability tracking measures where the system is exposed to attack."]
  - [A84:XC-PC-B1, example_of, "Continuous scanning keeps up with changes across the AI software stack."]
- id: GM-SEC-03
  family: SEC
  title: Access control over models, configuration, and monitoring data
  objective: Only identified roles can change model configuration, thresholds, the organization's source-attribute record, or monitoring results; privileged access is separate and MFA-protected; access is reviewed and revoked promptly.
  activity: Enforce role-based access; review access quarterly; monitor failed logins to AI administration endpoints.
  evidence: Access control lists; access review records; login monitoring alerts.
  cadence: Quarterly review; continuous login monitoring.
  owner_role: Identity and access management
  links:
  - [CPG:3.H, integral_to, "Least privilege over AI configuration and monitoring data is this CPG goal applied to AI."]
  - [CPG:3.F, example_of, "MFA protects AI administration access."]
  - [CPG:3.G, example_of, "Administrators use separate privileged accounts for AI configuration."]
  - [CPG:3.D, example_of, "Departing staff lose access to AI configuration and monitoring data."]
  - [CPG:3.E, example_of, "Failed logins to AI administration endpoints are monitored."]
  - [RMF:MEASURE-2.7, example_of, "Access control evidence supports the security evaluation."]
  - [A84:SEC, example_of, "Unauthorized change to models or monitoring records is a misuse path within the scope of security monitoring."]
- id: GM-SEC-04
  family: SEC
  title: Privacy-preserving handling of monitoring data
  objective: Monitoring data are minimized, de-identified where feasible, encrypted in transit and at rest, and retention-limited, and the privacy impact of monitoring (including telemetry about users) is assessed.
  activity: Assess privacy impact of the monitoring design; apply minimization and encryption; enforce retention limits.
  evidence: Privacy impact assessment; data handling configuration; retention enforcement records.
  cadence: Before go-live; on change to monitoring data.
  owner_role: Privacy officer
  links:
  - [A84:XC-TMT-B3, example_of, "Privacy-preserving handling of monitoring data is one response to the concern that monitoring may infringe privacy."]
  - [RMF:MEASURE-2.10, example_of, "Examining the privacy risk of the AI system includes the privacy risk of monitoring it."]
  - [RMF:MAP-1.6, example_of, "Privacy requirements for monitoring data are elicited system requirements."]
  - [CPG:3.K, example_of, "Monitoring data are protected with strong encryption."]
# ------------------------------------------------------------------ CMP
- id: GM-CMP-01
  family: CMP
  title: Requirements register for the deployed system
  objective: A register lists the legal, regulatory, certification, and contractual obligations that apply to the deployed AI system and the monitoring evidence that meets each, and is reviewed when requirements change.
  activity: Maintain the register; review it at least annually and on regulatory change; link each obligation to GAP-M evidence.
  evidence: Requirements register with evidence links.
  cadence: Annual; on regulatory change.
  owner_role: Compliance officer
  links:
  - [RMF:GOVERN-1.1, integral_to, "GOVERN 1.1 requires AI legal and regulatory requirements to be documented; documenting them is this control's core."]
  - [A84:CMP-B1, example_of, "A maintained requirements register is one tool for navigating a complex policy landscape."]
  - [A84:CMP, example_of, "A requirements register lists the obligations compliance monitoring measures against."]
  - [RMF:MAP-1.1, example_of, "The register documents context-specific laws for the deployment setting."]
  - [CPG:1.A, example_of, "CPG 1.A asks that legal and regulatory cybersecurity requirements are implemented and managed."]
  - [CPG:1.B, example_of, "Regulatory obligations feed the organization's governance policies."]
- id: GM-CMP-02
  family: CMP
  title: Source-attribute completeness audit
  objective: Each predictive-DSI source attribute is periodically audited to confirm it is populated, within its review interval, backed by evidence, or, where the regulation allows, explicitly shown as not available.
  activity: Sample the attribute register; check population, review date, and evidence; log and fix discrepancies.
  evidence: Audit worksheet; discrepancy log.
  cadence: Annually, before accreditation reviews, and after developer certification updates.
  owner_role: Compliance officer with clinical informatics
  links:
  - [HTI:B6.i, example_of, "The audit checks that missing external validation information is shown as not available, the indication 170.315(b)(11)(v)(A)(2) calls for."]
