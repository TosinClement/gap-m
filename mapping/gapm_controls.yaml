  - [HTI:B8.iv, example_of, "The audit checks the not-available indication for this attribute."]
  - [HTI:B9.i, example_of, "The audit checks the not-available indication for this attribute."]
  - [HTI:B9.ii, example_of, "The audit checks the not-available indication for this attribute."]
