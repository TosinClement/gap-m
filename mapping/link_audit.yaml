# Necessity audit of every link that asserted necessity (all integral_to and precedes links
# as they stood before the audit). Pre-review audit prepared with AI assistance; it is NOT
# the author's review. Every link stays review_status: proposed
prepared: '2026-10-05'
cores:
  GM-GOV-01: A post-deployment monitoring plan covering the system exists.
  GM-GOV-02: Deployed AI systems are recorded in an inventory.
  GM-GOV-03: Contracts with the developer require notice of security incidents and vulnerabilities.
  GM-GOV-04: The incident response plan addresses AI-specific incidents.
  GM-GOV-05: A defined policy governs sharing monitoring findings outside the organization.
  GM-GOV-06: Monitoring has a budget, and monitoring staff and users are trained for the system.
  GM-GOV-07: Someone independent of the build/operate team periodically assesses the monitoring.
  GM-FUN-01: A pre-deployment local baseline with deviation thresholds is recorded.
  GM-FUN-02: Validity is measured in the deploying organization's own data.
  GM-FUN-03: Input data and population mix are compared against a reference distribution.
  GM-FUN-04: Reference-standard outcome labels are obtained for monitored cases.
  GM-FUN-05: Performance results from earlier points in time remain available for comparison.
  GM-FUN-06: A mechanism with assigned authority exists to supersede, disengage, or deactivate the system.
  GM-FAIR-01: Subgroup performance is evaluated before deployment.
  GM-FAIR-02: Fairness of the intervention is measured in the deploying organization's own data (subgroup performance and output disparities).
  GM-OPS-01: Administrative and security logs of the AI system's components that the organization operates go to the organization's central, access-protected log store, with an alert if logging stops.
  GM-OPS-02: Service levels and indirect costs of the AI system are tracked.
  GM-OPS-03: Changes the organization makes to AI models and configuration pass through change control.
  GM-OPS-04: AI artifacts and configuration are backed up and restorable; a fallback workflow exists.
  GM-HF-01: End users can report problems with outputs, and the reports are integrated into monitoring metrics.
  GM-HF-02: User interactions with outputs are measured.
  GM-HF-03: The deploying organization updates the source-attribute record when an underlying fact changes.
  GM-SEC-01: AI-specific anomalous or adversarial behavior is detected.
  GM-SEC-02: AI software components the organization operates are in its vulnerability management program.
  GM-SEC-03: Access to AI configuration and monitoring data follows least privilege.
  GM-SEC-04: Monitoring data are handled with privacy protections.
  GM-CMP-02: Each source attribute is periodically checked for population, currency, evidence, or a not-available indication.
  GM-CMP-01: Applicable AI legal and regulatory requirements are documented.
  GM-CMP-03: Use of the system is checked against its documented intended scope.
  GM-LSI-01: AI incidents and errors are recorded.
  GM-LSI-02: Benefit measures are defined and tracked.
  GM-LSI-03: Patients and affected communities have a route to report problems and appeal outcomes, fed into metrics.
