- link: GM-FUN-04>HTI:B8.ii
  was: precedes
  verdict: unresolved
  now: example_of
  basis: 'Second pass, as substantiated on 2026-10-05: outcome-based validity measures (discrimination, calibration, positive predictive value) use local outcome labels. Label-free performance estimation exists in the literature: Garg et al. (ICLR 2022, arXiv:2201.04234) propose Average Thresholded Confidence (ATC), which predicts accuracy "as the fraction of unlabeled examples for which model confidence exceeds that threshold" learned on labeled source data. The same paper shows that "absent further assumptions, accuracy on the target is identifiable iff p_t(y|x) is uniquely identified", and names covariate shift (p_s(y|x) = p_t(y|x)) and label shift as conditions under which estimation can work; it estimates accuracy only and was evaluated on image benchmarks. A label-free estimate of local validity therefore rests on an assumption that the outcome relationship has not shifted, which is part of what local validation would test. Whether such an estimate counts as "validity of intervention in local data" is an interpretive question, so the precedes claim is neither supported nor refuted; it is held as unresolved.'
  condition: 'Labels must come first if "validity of intervention in local data" means validity measured against local outcomes, rather than estimated from unlabeled local data under an assumption that p(y|x) is unchanged from the development setting.'
  relevance: supported
  relevance_basis: '(B)(8)(ii) names "Validity of intervention in local data". GM-FUN-04 obtains local outcome labels, which every outcome-based validity measure uses. The control is therefore one substantive way to support the attribute even if labels are not strictly required.'
  pass1:
    verdict: supported
    now: precedes
    basis: Validity is agreement between outputs and true outcomes; validity in local data cannot be computed until local outcomes (labels) exist, so obtaining them must come first.
  rationale: Local outcome labels come first for outcome-based validity measures such as discrimination and calibration; whether every local validity value is label-based is unresolved.
- link: GM-FUN-04>HTI:B8.iv
  was: precedes
  verdict: revised
  now: example_of
  basis: 'Second pass: fairness measures such as demographic or output-rate parity compare outputs across groups and need no outcome labels, so obtaining labels is not a prerequisite for every local fairness value. The precedes claim holds only for label-dependent measures and is downgraded.'
  pass1:
    verdict: supported
    now: precedes
    basis: Fairness of the intervention in local data compares subgroup performance against true outcomes; local outcomes must exist first.
  rationale: For label-dependent fairness measures such as subgroup calibration or error-rate parity, local outcome labels come first; label-free measures such as output-rate parity can be computed without them.
