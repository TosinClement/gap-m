second_pass:
  date: '2026-10-05'
  by: AI assistant (tooling-assisted); not independent expert validation; not the author's review
  scope: All 21 links still asserting integral_to or precedes after the first pass, rechecked against the narrowed control core and exact source text; relevance of every unresolved link assessed separately from necessity.
  cores_previous:
    GM-GOV-01: A written post-deployment monitoring plan with a named owner exists for the system.
    GM-GOV-03: Contracts with the developer require notice of security incidents and vulnerabilities (and model changes).
    GM-FUN-05: Performance results are retained over time so they can be compared.
    GM-FUN-06: A deactivation/correction mechanism exists with an assigned authority.
    GM-FAIR-02: Subgroup performance is measured in the deploying organization's own data.
    GM-OPS-01: AI system logs go to the organization's central, access-protected log store, with alerts if logging stops.
    GM-HF-01: End users can report problems with outputs, and reports are evaluated and fed into monitoring metrics.
    GM-SEC-02: AI software components are in the vulnerability management program.
    GM-LSI-01: AI incidents and near misses are recorded.
